<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stride">
  <title>Stride</title>
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<body>
  <header class="topbar">
    <button class="icon-btn back" id="backBtn" hidden aria-label="Terug">‹</button>
    <h1 id="title">Stride</h1>
    <div class="topbar-right" id="topRight"></div>

  <main id="view"></main>

  <div class="live-pill" id="livePill" hidden>
    <span class="dot"></span><span id="livePillText">Opname loopt</span>
  </div>

  <nav class="tabbar" id="tabbar">
    <a href="#/record" data-tab="record"><span class="ti">●</span><span>Opnemen</span></a>
    <a href="#/activities" data-tab="activities"><span class="ti">≡</span><span>Activiteiten</span></a>

    <a href="#/training" data-tab="training"><span class="ti">↗</span><span>Training</span></a>
    <a href="#/me" data-tab="me"><span class="ti">◐</span><span>Ik</span></a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/hr.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/views-record.js"></script>
  <script src="js/views-activities.js"></script>
  <script src="js/views-explore.js"></script>
  <script src="js/views-training.js"></script>
  <script src="js/views-me.js"></script>
  <script src="js/app.js"></script>

</html>
